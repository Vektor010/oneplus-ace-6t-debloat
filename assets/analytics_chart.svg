<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B101B"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EB0028"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bar6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="bar7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Main Container -->
  <rect x="0" y="0" width="1200" height="440" rx="18" fill="url(#dashBg)"/>
  <rect x="1" y="1" width="1198" height="438" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5"/>

  <!-- LEFT PANEL: Category Breakdown (x: 32..690) -->
  <rect x="32" y="28" width="664" height="384" rx="14" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
  <text x="58" y="64" font-family="Segoe UI, -apple-system, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">Распределение 95 компонентов по категориям</text>
  <text x="58" y="86" font-family="Segoe UI, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#64748B">82 пакета (pm disable-user) + 13 защищённых служб (pm suspend)</text>

  <!-- Row 1: 31 (max bar width = 300px) -->
  <text x="58" y="128" font-family="Segoe UI, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#E2E8F0">Утилиты и фичи ColorOS / OPlus</text>
  <rect x="310" y="114" width="300" height="18" rx="9" fill="#1E293B"/>
  <rect x="310" y="114" width="300" height="18" rx="9" fill="url(#bar1)"/>
  <text x="624" y="128" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#FB923C">31</text>

  <!-- Row 2: 15 (145px) -->
  <text x="58" y="168" font-family="Segoe UI, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#E2E8F0">Китайские сервисы (Baidu, HeyTap)</text>
  <rect x="310" y="154" width="300" height="18" rx="9" fill="#1E293B"/>
  <rect x="310" y="154" width="145" height="18" rx="9" fill="url(#bar2)"/>
  <text x="624" y="168" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#FBBF24">15</text>

  <!-- Row 3: 14 (135px) -->
  <text x="58" y="208" font-family="Segoe UI, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#E2E8F0">Телеметрия, логи и реклама SDK</text>
  <rect x="310" y="194" width="300" height="18" rx="9" fill="#1E293B"/>
  <rect x="310" y="194" width="135" height="18" rx="9" fill="url(#bar3)"/>
  <text x="624" y="208" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#E879F9">14</text>

  <!-- Row 4: 13 Suspend (126px) -->
  <text x="58" y="248" font-family="Segoe UI, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#38BDF8">Замороженные службы (pm suspend)</text>
  <rect x="310" y="234" width="300" height="18" rx="9" fill="#1E293B"/>
  <rect x="310" y="234" width="126" height="18" rx="9" fill="url(#bar4)"/>
  <text x="624" y="248" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#38BDF8">13</text>

  <!-- Row 5: 13 Android/QTI (126px) -->
  <text x="58" y="288" font-family="Segoe UI, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#E2E8F0">Службы Android / Qualcomm / MS</text>
  <rect x="310" y="274" width="300" height="18" rx="9" fill="#1E293B"/>
  <rect x="310" y="274" width="126" height="18" rx="9" fill="url(#bar5)"/>
  <text x="624" y="288" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#A78BFA">13</text>

  <!-- Row 6: 5 Auto/IoT (48px) -->
  <text x="58" y="328" font-family="Segoe UI, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#E2E8F0">Автомобильные сервисы и IoT</text>
  <rect x="310" y="314" width="300" height="18" rx="9" fill="#1E293B"/>
  <rect x="310" y="314" width="48" height="18" rx="9" fill="url(#bar6)"/>
  <text x="624" y="328" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#34D399">5</text>

  <!-- Row 7: 4 Google (39px) -->
  <text x="58" y="368" font-family="Segoe UI, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#E2E8F0">Доп. приложения Google (без GMS)</text>
  <rect x="310" y="354" width="300" height="18" rx="9" fill="#1E293B"/>
  <rect x="310" y="354" width="39" height="18" rx="9" fill="url(#bar7)"/>
  <text x="624" y="368" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#94A3B8">4</text>

  <!-- RIGHT PANEL: Before vs After Metrics (x: 720..1168) -->
  <rect x="720" y="28" width="448" height="384" rx="14" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
  <text x="746" y="64" font-family="Segoe UI, -apple-system, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">Эффект оптимизации (До / После)</text>
  <text x="746" y="86" font-family="Segoe UI, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#64748B">Проверено на реальном OnePlus Ace 6T CN01</text>

  <!-- Metric Block 1 -->
  <rect x="746" y="108" width="396" height="82" rx="12" fill="#0F172A" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <text x="766" y="134" font-family="Segoe UI, -apple-system, Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Активный китайский софт и телеметрия</text>
  <text x="766" y="168" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#EF4444">95</text>
  <text x="808" y="166" font-family="Segoe UI, sans-serif" font-size="18" fill="#64748B">→</text>
  <text x="838" y="168" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#10B981">0</text>
  <rect x="920" y="148" width="200" height="12" rx="6" fill="#1E293B"/>
  <rect x="920" y="148" width="200" height="12" rx="6" fill="#10B981" fill-opacity="0.25"/>
  <text x="1020" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#34D399">-100% фоновых задач</text>

  <!-- Metric Block 2 -->
  <rect x="746" y="206" width="396" height="82" rx="12" fill="#0F172A" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <text x="766" y="232" font-family="Segoe UI, -apple-system, Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Защита ядра, Gboard, Лаунчера и Google Play</text>
  <rect x="766" y="250" width="290" height="14" rx="7" fill="#1E293B"/>
  <rect x="766" y="250" width="290" height="14" rx="7" fill="#10B981"/>
  <text x="1072" y="262" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#34D399">100%</text>

  <!-- Metric Block 3 -->
  <rect x="746" y="304" width="396" height="82" rx="12" fill="#0F172A" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <text x="766" y="330" font-family="Segoe UI, -apple-system, Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Уровень риска / Необходимость Root</text>
  <rect x="766" y="346" width="114" height="26" rx="13" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="823" y="363" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#6EE7B7">БЕЗ ROOT</text>
  <rect x="892" y="346" width="114" height="26" rx="13" fill="#3B82F6" fill-opacity="0.16" stroke="#3B82F6" stroke-opacity="0.5"/>
  <text x="949" y="363" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#93C5FD">АВТОБЭКАП</text>
  <rect x="1018" y="346" width="106" height="26" rx="13" fill="#F97316" fill-opacity="0.16" stroke="#F97316" stroke-opacity="0.5"/>
  <text x="1071" y="363" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FDBA74">ОТКАТ 1 КЛИК</text>
</svg>
