<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B101B"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="210" rx="16" fill="url(#pipeBg)"/>
  <rect x="1" y="1" width="1198" height="208" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5"/>

  <text x="36" y="42" font-family="Segoe UI, -apple-system, Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Конвейер защиты от «кирпича» (Zero-Brick Architecture)</text>

  <!-- Step 1 -->
  <rect x="36" y="64" width="204" height="114" rx="12" fill="#0F172A" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="54" y="92" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#60A5FA">STEP 01</text>
  <text x="54" y="118" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Поиск ADB</text>
  <text x="54" y="142" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#94A3B8">Локальный ADB +</text>
  <text x="54" y="160" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#94A3B8">изоляция -s serial</text>

  <!-- Arrow 1 -->
  <path d="M 248 121 L 266 121" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <polygon points="266,116 274,121 266,126" fill="#64748B"/>

  <!-- Step 2 -->
  <rect x="278" y="64" width="204" height="114" rx="12" fill="#0F172A" stroke="#F97316" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="296" y="92" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#FB923C">STEP 02</text>
  <text x="296" y="118" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Проверка PLR110</text>
  <text x="296" y="142" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#94A3B8">Строгий фильтр</text>
  <text x="296" y="160" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#94A3B8">модели и CN01</text>

  <!-- Arrow 2 -->
  <path d="M 490 121 L 508 121" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <polygon points="508,116 516,121 508,126" fill="#64748B"/>

  <!-- Step 3 -->
  <rect x="520" y="64" width="204" height="114" rx="12" fill="#0F172A" stroke="#10B981" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="538" y="92" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#34D399">STEP 03</text>
  <text x="538" y="118" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Whitelist + Бэкап</text>
  <text x="538" y="142" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#94A3B8">Защита Gboard, GMS,</text>
  <text x="538" y="160" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#94A3B8">лаунчера и VPN</text>

  <!-- Arrow 3 -->
  <path d="M 732 121 L 750 121" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <polygon points="750,116 758,121 750,126" fill="#64748B"/>

  <!-- Step 4 -->
  <rect x="762" y="64" width="204" height="114" rx="12" fill="#0F172A" stroke="#EC4899" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="780" y="92" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#F472B6">STEP 04</text>
  <text x="780" y="118" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Оптимизация</text>
  <text x="780" y="142" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#94A3B8">82 Disable + 13 Freeze</text>
  <text x="780" y="160" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#94A3B8">+ ART speed-profile</text>

  <!-- Arrow 4 -->
  <path d="M 974 121 L 992 121" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <polygon points="992,116 1000,121 992,126" fill="#64748B"/>

  <!-- Step 5 -->
  <rect x="1004" y="64" width="160" height="114" rx="12" fill="#0F172A" stroke="#06B6D4" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="1022" y="92" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#22D3EE">STEP 05</text>
  <text x="1022" y="118" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Откат 100%</text>
  <text x="1022" y="142" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#94A3B8">Пункт меню [4]</text>
  <text x="1022" y="160" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#94A3B8">возвращает всё</text>
</svg>
